  --bg:#EDF1F2; --surface:#FFFFFF; --surface-2:#E3E9EB; --ink:#15212A; --muted:#566670; --line:#CBD5D9;
  --accent:#C9720F; --accent-soft:#F6E3C8; --teal:#1C6F75; --teal-soft:#D4E9EA;
  --good:#1F7A4A; --good-soft:#D8EEDF; --bad:#A63A2C; --bad-soft:#F4DCD7; --purple:#6B3FA8; --purple-soft:#E9E0F6;
  --map-bg:#0F1A1F; --map-dot:#7FA3AE; --map-grid:#1E2E35;
  --display:"Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1518; --surface:#152024; --surface-2:#1C2A2F; --ink:#E3ECEE; --muted:#95A7AE; --line:#2A3A40;
    --accent:#F0A640; --accent-soft:#3A2A14; --teal:#5FC0C5; --teal-soft:#16353A;
    --good:#6BD19A; --good-soft:#16321F; --bad:#F08A7A; --bad-soft:#3A1D19; --purple:#B99AF0; --purple-soft:#2A2040;
    --map-bg:#081013; --map-dot:#6E8F99; --map-grid:#16242A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1518; --surface:#152024; --surface-2:#1C2A2F; --ink:#E3ECEE; --muted:#95A7AE; --line:#2A3A40;
  --accent:#F0A640; --accent-soft:#3A2A14; --teal:#5FC0C5; --teal-soft:#16353A;
  --good:#6BD19A; --good-soft:#16321F; --bad:#F08A7A; --bad-soft:#3A1D19; --purple:#B99AF0; --purple-soft:#2A2040;
  --map-bg:#081013; --map-dot:#6E8F99; --map-grid:#16242A;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%; box-sizing:border-box}
body{background:var(--bg); color:var(--ink); font:15px/1.5 var(--body); height:100%; overflow:hidden; padding:0}
:root{--gut:max(16px, calc((100vw - 1100px) / 2))}
.wrap{height:100%; display:flex; flex-direction:column; min-height:0}
header.top{flex:none; padding-inline:var(--gut)}
.scroller{flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain; padding-inline:var(--gut); padding-bottom:48px; scroll-padding-top:12px}
.brand{display:grid; gap:4px}
@media (max-height:760px), (max-width:640px){ header.top .lede{display:none} }
header.top{padding-block:14px 8px; display:grid; gap:6px}
.eyebrow{font:600 12px/1 var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--teal)}
h1{font:700 clamp(26px,5vw,38px)/1.05 var(--display); margin:0; letter-spacing:.01em}
h2{font:600 20px/1.2 var(--display); margin:0}
h3{font:600 15px/1.3 var(--display); margin:0; letter-spacing:.02em}
.lede{margin:0; color:var(--muted); max-width:70ch}
.muted{color:var(--muted)}
.small{font-size:13px}
button{font:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.chip:focus-visible,canvas:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

nav.tabs{flex:none; z-index:10; background:var(--bg); padding-inline:var(--gut); display:flex; gap:4px; overflow-x:auto; padding-block:8px; border-bottom:1px solid var(--line); scrollbar-width:thin}
nav.tabs button{border:0; background:transparent; color:var(--muted); font:600 14px var(--display); letter-spacing:.03em; padding:8px 12px; border-radius:8px; cursor:pointer; white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--ink); color:var(--bg)}
nav.tabs .n{font:600 11px var(--mono); margin-left:5px; padding:1px 5px; border-radius:8px; background:var(--accent-soft); color:var(--accent)}
section.panel{padding-top:16px; display:grid; gap:14px}

.controls{display:grid; gap:10px}
.row{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.search{flex:1 1 260px; display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:0 10px}
.search input{flex:1; min-width:0; border:0; background:transparent; color:var(--ink); font:15px var(--body); padding:10px 0}
.search input:focus{outline:none}
.search:focus-within{border-color:var(--accent)}
.clear{border:0; background:transparent; color:var(--muted); font:600 13px var(--body); cursor:pointer; padding:4px 6px}
.seg{display:inline-flex; flex-wrap:wrap; background:var(--surface-2); border-radius:8px; padding:3px; gap:2px}
.seg button{border:0; background:transparent; color:var(--muted); font:500 13px var(--body); padding:6px 10px; border-radius:6px; cursor:pointer; white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg.big button{font:600 14px var(--display); letter-spacing:.03em; padding:7px 14px}
.lbl{font:600 11px/1 var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
select,input.txt,textarea{background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:8px; font:500 14px var(--body); padding:8px 10px}
textarea{width:100%; resize:vertical; min-height:60px}
.toggle{display:inline-flex; align-items:center; gap:6px; font:500 13px var(--body); color:var(--muted); cursor:pointer}
.count{margin-left:auto; font:600 13px var(--mono); color:var(--muted); font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line); background:var(--surface); color:var(--ink); font:600 13px var(--body); padding:8px 12px; border-radius:8px; cursor:pointer}
.btn:hover{border-color:var(--teal)}
.btn.primary{background:var(--teal); border-color:var(--teal); color:var(--bg)}
.btn.ghost{background:transparent}

.list{display:grid}
.rec{display:grid; grid-template-columns:1fr auto auto; gap:12px; align-items:center; padding:11px 4px; border-bottom:1px solid var(--line)}
.flow{display:flex; flex-wrap:wrap; align-items:center; gap:6px; min-width:0}
.plus{color:var(--muted); font:600 13px var(--mono)}
.arrow{color:var(--accent); font:700 16px var(--mono); padding-inline:2px}
.chip{display:inline-flex; align-items:baseline; gap:5px; border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:6px; padding:4px 8px; font:500 13.5px/1.25 var(--body); cursor:pointer; text-align:left}
.chip:hover{border-color:var(--teal)}
.chip .q{font:600 12.5px var(--mono); color:var(--muted); font-variant-numeric:tabular-nums}
.chip.out{background:var(--teal-soft); border-color:transparent; font-weight:600}
.chip.out .q{color:var(--teal)}
.chip mark{background:var(--accent-soft); color:inherit; border-radius:2px; padding:0 1px}
.tag{font:600 10px/1 var(--mono); letter-spacing:.06em; text-transform:uppercase; padding:3px 5px; border-radius:4px; align-self:center; white-space:nowrap}
.tag.purple{background:var(--purple-soft); color:var(--purple)}
.tag.nan{background:var(--accent-soft); color:var(--accent)}
.tag.cat{background:var(--surface-2); color:var(--muted)}
.op{width:100%; font:500 12px var(--mono); color:var(--muted)}
.stats{display:grid; justify-items:end; gap:3px; font-variant-numeric:tabular-nums}
.mult{font:600 15px var(--mono); padding:3px 8px; border-radius:6px}
.mult.up{background:var(--good-soft); color:var(--good)}
.mult.flat{background:var(--surface-2); color:var(--muted)}
.mult.down{background:var(--bad-soft); color:var(--bad)}
.profit{font:500 12.5px var(--mono); color:var(--muted); white-space:nowrap}
.qty{color:var(--teal)}
.pin{border:0; background:transparent; cursor:pointer; color:var(--line); font-size:20px; line-height:1; padding:4px}
.pin[aria-pressed="true"]{color:var(--accent)}
.pin:hover{color:var(--accent)}
.empty{padding:36px 8px; color:var(--muted); text-align:center}
.more{margin:14px auto 0; display:block}

.card{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px 16px; display:grid; gap:8px}
.itemcard{border-left:3px solid var(--teal)}
.kv{display:flex; flex-wrap:wrap; gap:6px 18px; font-size:13.5px}
.kv b{font:600 11px var(--mono); letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-right:6px}
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:14px}
table.t{border-collapse:collapse; width:100%; font-size:14px}
table.t th{font:600 11px var(--mono); letter-spacing:.06em; text-transform:uppercase; color:var(--muted); text-align:left; padding:6px 8px; border-bottom:1px solid var(--line)}
table.t td{padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:top}
.tbl{overflow-x:auto}
.dot{display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:middle}

/* planner */
.inv{display:flex; flex-wrap:wrap; gap:6px}
.invi{display:inline-flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:3px 4px 3px 8px; font-size:13.5px}
.invi input{width:72px; border:1px solid var(--line); border-radius:4px; background:var(--bg); color:var(--ink); font:600 12.5px var(--mono); padding:2px 4px}
.invi button{border:0; background:transparent; color:var(--muted); cursor:pointer; font-size:16px; padding:0 4px}
.note{font-size:13px; color:var(--muted); background:var(--surface-2); border-radius:8px; padding:8px 10px}

/* portals */
.glyphpad{display:grid; grid-template-columns:repeat(8,minmax(0,1fr)); gap:6px}
.gkey{border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:8px; padding:8px 4px; cursor:pointer; display:grid; gap:2px; justify-items:center; text-align:center}
.gkey:hover{border-color:var(--teal)}
.gkey .gn{font:700 16px var(--mono); color:var(--teal)}
.gkey .gl{font:600 11.5px var(--body)}
.gkey .gh{font:500 10.5px var(--body); color:var(--muted)}
.addr{display:flex; flex-wrap:wrap; gap:6px}
.slot{min-width:62px; border:1px dashed var(--line); border-radius:8px; padding:6px 4px; text-align:center; background:var(--surface)}
.slot.fill{border-style:solid; border-color:var(--teal)}
.slot .sn{font:600 10px var(--mono); color:var(--muted)}
.slot .sv{font:700 16px var(--mono); color:var(--teal)}
.slot .sl{font:500 11px var(--body)}
.slot.p1{border-color:var(--accent)}
.slot.p1 .sv{color:var(--accent)}
.codes{display:grid; gap:4px; font:600 14px var(--mono)}
.codes span{color:var(--muted); font:600 11px var(--mono); letter-spacing:.06em; text-transform:uppercase; margin-right:8px}
.saved{display:grid; gap:0}
.srow{display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center; padding:9px 2px; border-bottom:1px solid var(--line)}
.srow .nm{font-weight:600}
.srow .cd{font:600 13px var(--mono); color:var(--teal)}
.srow .acts{display:flex; gap:6px}

/* galaxy */
.mapwrap{position:relative; background:var(--map-bg); border-radius:12px; overflow:hidden; border:1px solid var(--line)}
canvas#map{display:block; width:100%; height:min(70vh,620px); cursor:grab; touch-action:none}
.mapctl{position:absolute; top:10px; right:10px; display:grid; gap:6px}
.mapctl button{width:36px; height:36px; border-radius:8px; border:1px solid #2F4650; background:#12222A; color:#DDE8EA; font:700 16px var(--mono); cursor:pointer}
.legend{position:absolute; left:10px; bottom:10px; display:flex; flex-wrap:wrap; gap:10px; font:600 11.5px var(--mono); color:#C9D6D9; background:rgba(8,16,19,.7); padding:6px 10px; border-radius:8px}
.info{min-height:120px}
.syslist{max-height:340px; overflow:auto; border:1px solid var(--line); border-radius:10px; background:var(--surface)}
.syslist button{display:grid; grid-template-columns:1fr auto; gap:8px; width:100%; text-align:left; border:0; border-bottom:1px solid var(--line); background:transparent; color:var(--ink); padding:8px 10px; cursor:pointer; font-size:13.5px}
.syslist button:hover{background:var(--surface-2)}
.syslist .d{font:500 12px var(--mono); color:var(--muted)}

/* quests */
.quests{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:12px}
.qcard{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px 14px; display:grid; gap:8px; border-top:3px solid var(--line)}
.qcard[data-s="done"]{border-top-color:var(--good)}
.qcard[data-s="doing"]{border-top-color:var(--accent)}
.qcard[data-s="todo"]{border-top-color:var(--line)}
.qhead{display:flex; gap:8px; align-items:flex-start; justify-content:space-between}
.qcard p{margin:0; font-size:13.5px}
.qcard .next{font-size:13.5px}
.qcard .next b{color:var(--accent)}
.qcard select{font-size:12.5px; padding:4px 6px}
.status{font:600 10.5px var(--mono); letter-spacing:.06em; text-transform:uppercase}

footer{margin-top:28px; color:var(--muted); font-size:13px; display:grid; gap:6px; max-width:80ch}
footer a{color:var(--teal)}
@media (max-width:640px){
  .rec{grid-template-columns:1fr auto}
  .rec .stats{grid-column:1 / -1; justify-items:start; grid-auto-flow:column; justify-content:start; gap:10px; align-items:center}
  .glyphpad{grid-template-columns:repeat(4,minmax(0,1fr))}
  .count{margin-left:0; width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}

/* header menu + drawer */
.toprow{display:flex; align-items:center; justify-content:space-between; gap:12px}
.menubtn{display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font:600 13px var(--body); padding:7px 12px; border-radius:999px; cursor:pointer; white-space:nowrap}
.menubtn:hover{border-color:var(--accent)}
.scrim{position:fixed; inset:0; background:rgba(5,10,12,.45); z-index:40}
.drawer{position:fixed; top:0; right:0; bottom:0; width:min(420px,100%); z-index:50; background:var(--bg); color:var(--ink); border-left:1px solid var(--line); box-shadow:-12px 0 32px rgba(0,0,0,.25); overflow-y:auto; padding:calc(16px + env(safe-area-inset-top,0px)) 18px calc(24px + env(safe-area-inset-bottom,0px)); display:grid; gap:16px; align-content:start}
.dhead{display:flex; align-items:center; justify-content:space-between}
.dsec{display:grid; gap:16px}
.field{display:grid; gap:8px}
.crow{display:flex; align-items:center; gap:10px; font-size:14px; padding:3px 0}
.crow input[type=color]{width:38px; height:28px; border:1px solid var(--line); border-radius:6px; background:var(--surface); padding:2px; cursor:pointer}
.presets{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px}
.preset{display:flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font:600 13px var(--body); padding:7px 9px; border-radius:8px; cursor:pointer; text-align:left}
.preset[aria-pressed="true"]{border-color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink)}
.preset .swatch{position:relative; width:34px; height:26px; border-radius:6px; flex:none; border:1px solid var(--line); overflow:hidden}
.preset .swatch span{position:absolute; bottom:0; width:50%; height:9px}
.preset .swatch span:first-child{left:0} .preset .swatch span:last-child{right:0}
.preset .pt{display:grid; line-height:1.2}
.preset .pn{font:600 13px var(--body)}
.preset .pd{font:500 11px var(--body); color:var(--muted)}
.navpick{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:6px}
.navpick button{display:grid; justify-items:center; gap:5px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font:600 12px var(--body); padding:8px 4px; border-radius:8px; cursor:pointer}
.navpick button[aria-pressed="true"]{border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent)}
.np{position:relative; width:34px; height:24px; border:1.5px solid var(--muted); border-radius:4px}
.np::after{content:""; position:absolute; background:var(--accent); border-radius:1px}
.np-top::after{left:2px; right:2px; top:2px; height:4px}
.np-bottom::after{left:2px; right:2px; bottom:2px; height:4px}
.np-left::after{left:2px; top:2px; bottom:2px; width:6px}
.np-right::after{right:2px; top:2px; bottom:2px; width:6px}
.np-drop::after{left:2px; top:2px; width:14px; height:5px}
details{background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:8px 12px}
details summary{font:600 14px var(--display); cursor:pointer; letter-spacing:.02em}
details p{margin:8px 0 0; font-size:13.5px}

/* nav layouts */
.navsel{display:none; align-items:center; gap:8px}
body.nav-dropdown nav.tabs > button{display:none}
body.nav-dropdown .navsel{display:flex}
body.nav-bottom nav.tabs{order:3; border-top:1px solid var(--line); border-bottom:0; padding-bottom:calc(8px + env(safe-area-inset-bottom,0px)); box-shadow:0 -6px 18px rgba(0,0,0,.10)}
@media (min-width:900px){ body.nav-bottom nav.tabs{justify-content:center} }
@media (min-width:760px){
  body.nav-left .wrap, body.nav-right .wrap{display:grid; grid-template-columns:210px minmax(0,1fr); grid-template-rows:auto minmax(0,1fr)}
  body.nav-right .wrap{grid-template-columns:minmax(0,1fr) 210px}
  body.nav-left .wrap > header, body.nav-right .wrap > header{grid-column:1 / -1; grid-row:1}
  body.nav-left nav.tabs, body.nav-right nav.tabs{grid-row:2; flex-direction:column; overflow-y:auto; border-bottom:0; padding:16px 12px; align-self:stretch}
  body.nav-left nav.tabs{grid-column:1; border-right:1px solid var(--line)}
  body.nav-right nav.tabs{grid-column:2; border-left:1px solid var(--line)}
  body.nav-left .scroller, body.nav-right .scroller{grid-row:2; padding-inline:24px}
  body.nav-left .scroller{grid-column:2}
  body.nav-right .scroller{grid-column:1}
  body.nav-left nav.tabs > button, body.nav-right nav.tabs > button{text-align:left}
  body.nav-left header.top, body.nav-right header.top{padding-inline:24px}
}
.themenote{font-size:12.5px; color:var(--muted)}
@media (max-width:640px){
  header.top .eyebrow{display:none}
  header.top h1{font-size:24px}
  .menubtn .mtxt{display:none}
  .menubtn{padding:9px}
  .rec{grid-template-columns:1fr auto; align-items:start}
  .rec .stats{grid-column:1}
  .rec .pin{grid-column:2; grid-row:1 / span 2}
}
.syncbar{gap:10px}
.syncpill{color:var(--teal)}
.autopill{display:inline-flex; align-items:center; gap:6px; cursor:pointer; color:var(--muted); user-select:none}
.autopill input{width:15px; height:15px; margin:0; accent-color:var(--teal); cursor:pointer}
.autopill.on{color:var(--teal); border-color:var(--teal)}
@media (max-width:640px){ .autopill .mtxt{display:none} }
/* portals v2 */
.addrbar{position:sticky; top:0; z-index:5; background:var(--surface); padding:8px 0 6px; margin:-4px 0 0; display:grid; gap:6px; border-bottom:1px solid var(--line)}
.slot{position:relative; cursor:pointer; user-select:none; transition:border-color .15s, background .15s}
.slot:hover{border-color:var(--teal)}
.slot.cur{border-style:solid; border-color:var(--accent); background:var(--accent-soft); box-shadow:0 0 0 2px var(--accent-soft)}
.slot .sx{position:absolute; top:-7px; right:-7px; width:20px; height:20px; border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--muted); font:700 13px/1 var(--body); cursor:pointer; padding:0; display:none; align-items:center; justify-content:center}
.slot:hover .sx, .slot.cur .sx, .slot:focus-within .sx{display:inline-flex}
.slot .sx:hover{color:var(--bad); border-color:var(--bad)}
@media (hover:none){ .slot.fill .sx{display:inline-flex} }
.slot.pop{animation:glyphpop .32s ease-out}
@keyframes glyphpop{0%{transform:scale(.7); background:var(--teal-soft)} 60%{transform:scale(1.08)} 100%{transform:scale(1)}}
.gkey:active{transform:scale(.96)}
button:disabled{opacity:.45; cursor:default}

/* inventory */
.ivbody{display:grid; gap:12px}
.ivc{gap:10px}
.ivc > summary{display:flex; flex-wrap:wrap; align-items:center; gap:8px; cursor:pointer; list-style:none}
.ivc > summary::-webkit-details-marker{display:none}
.ivc > summary::before{content:'▾'; color:var(--muted); font-size:12px; width:12px}
.ivc:not([open]) > summary::before{content:'▸'}
.ivh{font:600 16px var(--display)}
.ivm{margin-left:auto}
.ivgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:6px}
.ivt{border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:7px 9px; display:grid; gap:3px; align-content:start}
.ivn{border:0; background:transparent; color:var(--ink); padding:0; font:600 13.5px/1.3 var(--body); text-align:left; cursor:pointer}
.ivn:hover{color:var(--teal); text-decoration:underline}
.ivn.plain{cursor:default}
.ivn.plain:hover{color:var(--ink); text-decoration:none}
.ivn mark{background:var(--accent-soft); color:inherit; border-radius:2px}
.ivq{display:flex; align-items:baseline; gap:2px; font:500 12.5px var(--mono); font-variant-numeric:tabular-nums}
.ivq b{font-weight:600; color:var(--teal)}
.ivv{margin-left:auto; color:var(--muted)}
.ivbar{height:3px; background:var(--surface-2); border-radius:2px; overflow:hidden}
.ivbar span{display:block; height:100%; background:var(--teal); opacity:.7}
.ivw{font-size:11.5px; color:var(--muted); line-height:1.35}
.ivw b{color:var(--ink); font-weight:600}

/* map bar */
.mapbar{gap:10px}
.rng{display:inline-flex; align-items:center; gap:6px}
.rng input[type=range]{width:120px; accent-color:var(--accent)}
.mapbar select{padding:6px 8px; font-size:13px}

/* custom presets */
.cslot{display:flex; gap:4px; align-items:stretch; min-width:0}
.cslot .preset{flex:1; min-width:0}
.cedit{border:1px solid var(--line); background:var(--surface); color:var(--muted); font:600 11.5px var(--body); border-radius:8px; padding:0 8px; cursor:pointer}
.cedit:hover{color:var(--ink); border-color:var(--teal)}
.preset.empty{border-style:dashed; background:transparent}
.preset .swatch.empty{display:inline-flex; align-items:center; justify-content:center; background:transparent; border-style:dashed; color:var(--muted); font:600 16px var(--body)}
.ceditor{display:grid; gap:6px; border:1px solid var(--line); border-radius:10px; padding:12px; background:var(--surface)}

/* bug report */
.bugpre{white-space:pre-wrap; word-break:break-word; font:500 11.5px/1.45 var(--mono); background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:10px; max-height:280px; overflow:auto; margin:8px 0 0}
.linkbtn{border:0; background:transparent; color:var(--teal); padding:0; font:inherit; cursor:pointer; text-decoration:underline}

/* keep wide rows from pushing cards past the screen edge */
section.panel > *, .card > *{min-width:0}
@media (max-width:640px){
  .rec .stats{display:flex; flex-wrap:wrap; gap:4px 10px; align-items:center}
  .addrbar .slot{min-width:0}
  .addr{display:grid; grid-template-columns:repeat(6,minmax(0,1fr))}
  .mapbar .rng input[type=range]{width:100px}
}

/* glyph icons */
.gsv{width:22px; height:22px; display:block}
.slot .sv{display:flex; flex-direction:column; align-items:center; gap:1px; line-height:1.1}
.slot .sv .gsv{width:24px; height:24px; color:var(--ink)}
.slot.p1 .sv .gsv{color:var(--accent)}
.slot .gnum{font:700 14px var(--mono)}
.ghex{font:600 11px var(--mono); color:var(--muted); margin-left:3px}
.gkey .gkv{width:30px; height:30px; color:var(--ink)}
.gkey:hover .gkv{color:var(--teal)}
.gstrip{display:inline-flex; flex-wrap:wrap; gap:2px; color:var(--ink)}
.gstrip .gsv{width:20px; height:20px}
.gstrip.big .gsv{width:26px; height:26px}
.gaddr{display:grid; gap:2px; margin-top:2px}
.gaddr .cd{font:600 13px var(--mono); color:var(--teal)}
.gaddr .cd.hex{color:var(--muted)}
.gpreview{display:flex; gap:10px}
.gprev{display:inline-flex; flex-direction:column; align-items:center; gap:2px; border:1px solid var(--line); border-radius:8px; padding:6px 10px; background:var(--surface); font:600 13px var(--mono)}
.gprev .gsv{width:26px; height:26px}
.gprev i{font:500 11px var(--body); font-style:normal; color:var(--muted)}

/* item icons: element tiles for resources, drawn pictograms for everything else */
.ico{--ic:#6E8F99; display:inline-flex; align-items:center; justify-content:center; flex:none; width:40px; height:40px; border-radius:8px; background:color-mix(in srgb, var(--ic) 30%, #0b1216); border:1px solid color-mix(in srgb, var(--ic) 65%, transparent); color:#F2F6F7}
.ico svg{width:62%; height:62%}
.ico.sym{background:linear-gradient(160deg, color-mix(in srgb, var(--ic) 80%, #fff 8%), color-mix(in srgb, var(--ic) 55%, #000))}
.ico.sym span{font:700 15px/1 var(--display); letter-spacing:.02em; text-shadow:0 1px 2px rgba(0,0,0,.45)}
.ico.sm{width:24px; height:24px; border-radius:5px}
.ico.sm.sym span{font-size:10.5px}
.ico.md{width:34px; height:34px}
.ivtop{display:flex; align-items:center; gap:7px}
.itemcard .findbtn{white-space:nowrap}
.ownbtn{justify-self:start; display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--teal-soft); color:var(--ink); border-radius:999px; padding:5px 12px; font:500 13.5px var(--body); cursor:pointer}
.ownbtn b{font:700 14px var(--mono); color:var(--teal)}
.ownbtn:hover{border-color:var(--teal)}
.itemcard{cursor:default}

/* inventory grid */
.igridwrap{overflow-x:auto; padding-bottom:4px}
.igrid{display:grid; grid-template-columns:repeat(var(--cols), 78px); gap:5px; justify-content:start}
.igrid.auto{grid-template-columns:repeat(auto-fill, 78px)}
.gc{position:relative; height:100px; border-radius:8px; background:var(--surface-2); border:1px solid var(--line); display:flex; flex-direction:column; align-items:center; padding:7px 4px 5px; gap:4px; overflow:hidden}
.gc.off{visibility:hidden}
.gc.empty{background:transparent; border-style:dashed; opacity:.55}
.gc.link{cursor:pointer}
.gc.link:hover{border-color:var(--teal)}
.gc.dim{opacity:.25}
.gc .ico{width:38px; height:38px}
.gc .gq{font:700 11.5px/1 var(--mono); color:var(--teal); order:3; margin-top:auto; padding-bottom:3px}
.gc .gnm{order:2; font:500 10.5px/1.2 var(--body); text-align:center; color:var(--ink); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; width:100%}
.gc .gbar{position:absolute; left:6px; right:6px; bottom:3px; height:2px; background:var(--line); border-radius:2px; overflow:hidden}
.gc .gbar span{display:block; height:100%; background:var(--teal)}

/* map hover panel */
.maptip{position:absolute; z-index:4; max-width:280px; pointer-events:none; background:rgba(8,16,19,.94); color:#DDE8EA; border:1px solid #2F4650; border-radius:10px; padding:9px 11px; font:500 12.5px/1.45 var(--body); display:grid; gap:2px; box-shadow:0 6px 18px rgba(0,0,0,.35)}
.maptip .tt{font:600 14px var(--display); margin-bottom:2px}
.maptip b{font:600 10.5px var(--mono); letter-spacing:.05em; text-transform:uppercase; color:#95A7AE; margin-right:4px}
.maptip .muted{color:#95A7AE}
.maptip .tag{font-size:10px}
.maptip .tclick{margin-top:4px; color:#F0A640; font:600 11.5px var(--mono)}

/* ================= v1.6 refresh: calmer, friendlier look ================= */
:root{
  --bg:#F2F5F6; --surface:#FFFFFF; --surface-2:#EAEFF1; --ink:#17232A; --muted:#5D6E76; --line:#D9E1E4;
  --accent:#C2760F; --accent-soft:#F7E8D2; --teal:#1E7176; --teal-soft:#DCEDEE;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1215; --surface:#141B1F; --surface-2:#1A2328; --ink:#E2EAEC; --muted:#8B9DA5; --line:#232F35;
    --accent:#F0AE4A; --accent-soft:#2E2617; --teal:#63C2C6; --teal-soft:#142B2C; --map-bg:#080E11; --map-grid:#152227;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1215; --surface:#141B1F; --surface-2:#1A2328; --ink:#E2EAEC; --muted:#8B9DA5; --line:#232F35;
  --accent:#F0AE4A; --accent-soft:#2E2617; --teal:#63C2C6; --teal-soft:#142B2C; --map-bg:#080E11; --map-grid:#152227;
}
body{font:14.5px/1.55 var(--body)}
h1{font:600 19px/1.15 var(--display); letter-spacing:.02em}
h2{font:600 16.5px/1.3 var(--display); letter-spacing:.015em}
h3{font:600 14px/1.3 var(--display); letter-spacing:.02em}
.lede{font-size:14px}

/* header */
header.top{padding-block:12px; gap:0; border-bottom:1px solid var(--line)}
.brand{display:flex; align-items:center; gap:12px; min-width:0}
.brand .bt{display:grid; gap:2px; min-width:0}
.logo{width:38px; height:38px; flex:none; border-radius:11px; display:grid; place-items:center; background:var(--surface); border:1px solid var(--line)}
.tagline{font:500 12.5px/1.3 var(--body); color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tagline .eyebrow{font:500 12px var(--body); letter-spacing:0; text-transform:none; color:var(--muted)}
.dotsep{opacity:.6; margin:0 2px}
.menubtn{font:500 13px var(--body); background:var(--surface); padding:7px 13px}
.menubtn:hover{border-color:var(--teal)}

/* navigation */
nav.tabs{padding-block:6px; gap:2px; border-bottom:1px solid var(--line)}
nav.tabs button{display:inline-flex; align-items:center; gap:7px; font:500 13.5px var(--body); letter-spacing:0; color:var(--muted); padding:7px 12px; border-radius:9px; transition:background .15s, color .15s}
nav.tabs button svg{width:16px; height:16px; flex:none; opacity:.85}
nav.tabs button:hover{color:var(--ink); background:var(--surface)}
nav.tabs button[aria-selected="true"]{background:var(--accent-soft); color:var(--accent)}
nav.tabs button[aria-selected="true"] svg{opacity:1}
@media (min-width:760px){ body.nav-left nav.tabs button, body.nav-right nav.tabs button{width:100%; padding:9px 12px} }

/* surfaces and controls */
section.panel{padding-top:18px; gap:16px}
.card{border-radius:12px; padding:16px 18px; gap:10px}
.btn{font:500 13px var(--body); border-radius:9px; padding:8px 13px; transition:border-color .15s, background .15s}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#1B1305; font-weight:600}
.btn.primary:hover{filter:brightness(1.07); border-color:var(--accent)}
.seg{border-radius:10px; padding:3px}
.seg button{font:500 13px var(--body); border-radius:7px}
.seg.big button{font:500 13.5px var(--body); letter-spacing:0; padding:7px 14px}
.seg button[aria-pressed="true"]{box-shadow:0 1px 2px rgba(0,0,0,.18)}
.search{border-radius:10px}
select, input.txt, textarea{border-radius:9px}
.lbl{font:600 10.5px/1 var(--mono); letter-spacing:.1em}
.chip{border-radius:7px; font-weight:500}
.chip.out{font-weight:500}
.rec{padding:12px 8px; border-radius:8px; border-bottom-color:color-mix(in srgb, var(--line) 70%, transparent)}
.rec:hover{background:color-mix(in srgb, var(--surface) 70%, transparent)}
.tag{border-radius:5px; font-weight:600}
details{border-radius:10px}
details summary{font:600 13.5px var(--display)}
.itemcard{border-left:3px solid var(--accent)}
.drawer{background:var(--bg)}
.pathbox{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px}
.pathval{font:500 13px var(--mono); word-break:break-all}
footer{border-top:1px solid var(--line); padding-top:16px}
@media (max-width:640px){ .tagline{display:none} h1{font-size:18px} }

/* ================= game-style inventory panel ================= */
.nmsframe{--ink:#E6F2F4; --muted:#9DBFC6; --line:rgba(255,255,255,.13); --surface:rgba(255,255,255,.05); --surface-2:rgba(0,0,0,.22); --teal:#83DDE3; --teal-soft:rgba(131,221,227,.14); --accent:#F6C544; --accent-soft:rgba(246,197,68,.16);
  color:var(--ink); border-radius:16px; padding:14px 16px 18px; border:1px solid #2B5761;
  background:radial-gradient(120% 90% at 18% 0%, #1E5C66 0%, #12363F 45%, #0B2027 100%); display:grid; gap:12px; box-shadow:0 8px 28px rgba(0,0,0,.25)}
.gtop{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px 18px; border-bottom:2px solid rgba(246,197,68,.75); padding-bottom:8px}
.gtabs{display:flex; flex-wrap:wrap; gap:2px}
.gtabs button{border:0; background:transparent; color:#CFE4E8; font:500 16px var(--display); letter-spacing:.07em; text-transform:uppercase; padding:5px 12px; border-radius:3px; cursor:pointer}
.gtabs button:hover{color:#fff; background:rgba(255,255,255,.07)}
.gtabs button[aria-pressed="true"]{background:#F6C544; color:#15191B}
.gcur{display:flex; flex-wrap:wrap; gap:6px 16px; font:600 13px var(--mono); color:#EAF5F7}
.gcur span{display:inline-flex; align-items:center; gap:6px}
.gcur b{font:500 10px var(--mono); letter-spacing:.08em; text-transform:uppercase; color:#8FB6BE}
.cu{display:inline-block; width:10px; height:10px; transform:rotate(45deg); border-radius:2px}
.cu.u{background:#CFE4E8} .cu.n{background:#7FC7F0} .cu.q{background:#F6C544}
.gsum{font-size:13px}
.nmsframe .ivc{background:transparent; border:0; padding:4px 0 0; box-shadow:none}
.nmsframe .ivc > summary{padding:2px 0 6px}
.nmsframe .ivh{font:500 15px var(--display); letter-spacing:.09em; text-transform:uppercase}
.nmsframe .tag.cat{background:rgba(255,255,255,.1); color:#CFE4E8}
.nmsframe .empty{color:#9DBFC6}
.nmsframe .ivt{background:rgba(0,0,0,.2)}
.nmsframe .igrid{grid-template-columns:repeat(var(--cols), 76px); gap:7px}
.nmsframe .igrid.auto{grid-template-columns:repeat(auto-fill, 76px)}
.nmsframe .igrid.names{row-gap:30px}
.nmsframe .gc{width:76px; height:76px; padding:0; display:block; border-radius:3px; border:2.5px solid rgba(255,255,255,.92); overflow:visible;
  background:linear-gradient(170deg, color-mix(in srgb, var(--ic) 88%, #fff 12%) 0%, color-mix(in srgb, var(--ic) 72%, #000 28%) 100%); box-shadow:0 2px 6px rgba(0,0,0,.35)}
.nmsframe .gc.link:hover{border-color:#F6C544; transform:translateY(-1px)}
.nmsframe .gc.dim{opacity:.2}
.nmsframe .gc.empty{border:1px solid rgba(255,255,255,.08); background:rgba(0,0,0,.22); box-shadow:none; opacity:1; display:grid; place-items:center; color:rgba(255,255,255,.22)}
.nmsframe .gc.empty svg{width:26px; height:26px}
.nmsframe .gc.off{visibility:hidden}
.gc .orb{position:absolute; left:50%; top:46%; width:34px; height:34px; margin:-17px 0 0 -17px; border-radius:50%;
  background:radial-gradient(circle at 34% 30%, #fff 0 8%, color-mix(in srgb, var(--ic) 70%, #fff 30%) 20%, var(--ic) 55%, color-mix(in srgb, var(--ic) 45%, #000 55%) 100%); box-shadow:0 3px 8px rgba(0,0,0,.45)}
.gc .pic{position:absolute; left:50%; top:45%; width:38px; height:38px; margin:-19px 0 0 -19px; color:rgba(255,255,255,.92); filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.gc .gpill{position:absolute; top:3px; left:3px; font:600 9.5px/1 var(--body); color:#2A3033; background:rgba(235,238,240,.9); border-radius:8px; padding:2px 6px; max-width:60px; overflow:hidden; white-space:nowrap}
.nmsframe .gc .gq{position:absolute; right:4px; bottom:2px; margin:0; padding:0; font:600 14.5px/1.1 var(--body); color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.95), 0 0 2px rgba(0,0,0,.8); order:0}
.nmsframe .gc .gnm{position:absolute; top:100%; left:-6px; right:-6px; margin-top:4px; font:500 10.5px/1.2 var(--body); color:#DDEEF1; text-align:center; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.nmsframe .gc .ico{display:none}
#itemcard:empty{display:none}
.nmsframe > *, .nmsframe .ivbody > *, .nmsframe .ivc{min-width:0}
@media (max-width:640px){
  .nmsframe{padding:10px 10px 14px}
  .gtabs button{font-size:13px; padding:4px 8px}
  .nmsframe .igrid{grid-template-columns:repeat(var(--cols), 54px); gap:5px}
  .nmsframe .igrid.auto{grid-template-columns:repeat(auto-fill, 54px)}
  .nmsframe .gc{width:54px; height:54px; border-width:2px}
  .gc .orb{width:24px; height:24px; margin:-12px 0 0 -12px}
  .gc .pic{width:26px; height:26px; margin:-13px 0 0 -13px}
  .nmsframe .gc .gq{font-size:11.5px}
  .gc .gpill{font-size:8.5px; padding:1px 4px}
}
.nmsframe .ivc{display:block; max-width:100%} .nmsframe .ivc > summary{margin-bottom:6px} .igridwrap{max-width:100%}
.ico.sym.long span{font-size:11px}
.ico.sm.sym.long span{font-size:8px}
@media (max-width:640px){ header.top h1{font-size:18px} }
.stardecode{background:var(--accent-soft); border-radius:10px; padding:10px 12px; font-size:14px}
.stardecode .dot, #starguide .dot{display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:middle}
.starsfx span b{font-family:var(--mono)}
#starguide td:nth-child(2){white-space:nowrap}
/* game icons */
.ico.img{background:none; border:0; padding:0; overflow:hidden}
.ico.img img{width:100%; height:100%; object-fit:contain; display:block}
.cimg{width:20px; height:20px; object-fit:contain; margin:-2px 2px -2px -4px; flex:none}
.chip:has(.cimg){align-items:center}
.gc .gpic{position:absolute; left:50%; top:46%; width:58px; height:58px; margin:-29px 0 0 -29px; object-fit:contain; filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.gibar{height:6px; border-radius:4px; background:var(--surface-2); overflow:hidden}
.gibar span{display:block; height:100%; width:3%; background:var(--teal); transition:width .3s}
@media (max-width:640px){ .gc .gpic{width:40px; height:40px; margin:-20px 0 0 -20px} }
/* loading screen */
.boot{position:fixed; inset:0; z-index:200; display:grid; place-items:center; background:var(--bg, #0d1418); color:var(--ink, #e8eef0); transition:opacity .35s}
.boot.out{opacity:0; pointer-events:none}
.bootin{display:grid; justify-items:center; gap:12px; max-width:min(520px, calc(100vw - 32px)); text-align:center; padding:16px}
.bootlogo svg{animation:bootspin 6s linear infinite}
@keyframes bootspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){ .bootlogo svg{animation:none} }
.boott{font:600 22px var(--display, var(--body, system-ui))}
.bootstep{font:500 14px var(--body, system-ui); color:var(--muted, #9aa)}
.bootbar{width:min(320px, 70vw); height:6px; border-radius:4px; background:var(--surface-2, #223); overflow:hidden}
.bootbar span{display:block; height:100%; width:8%; background:var(--teal, #4fb3bf); transition:width .4s}
.boottip{display:grid; gap:4px; margin-top:14px; min-height:64px; font:400 15px/1.45 var(--body, system-ui)}
.boottip .lbl{font:600 11px var(--mono, monospace); letter-spacing:.08em; text-transform:uppercase; color:var(--accent, #e8a33d)}
/* inventory filters */
.ivfilters{display:grid; gap:8px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--surface)}
.ivfilters .row{gap:8px; align-items:center}
.ivfilters .lbl{min-width:44px}
.fchips{display:flex; flex-wrap:wrap; gap:6px}
.fchip{border:1px solid var(--line); background:var(--surface-2); color:var(--muted); font:500 12.5px var(--body); padding:5px 10px; border-radius:999px; cursor:pointer}
.fchip[aria-pressed="true"]{background:var(--teal-soft); border-color:var(--teal); color:var(--ink)}
/* how many can I make */
.mkbtn{display:inline-flex; flex-wrap:wrap; gap:4px 10px; border:1px dashed var(--line); background:transparent; color:var(--muted); font:500 12.5px var(--body); padding:4px 9px; border-radius:7px; cursor:pointer}
.mkbtn b{color:var(--accent); font-family:var(--mono); margin-right:3px}
.mkbtn:hover{border-color:var(--accent)}
.mkwrap{margin:-4px 0 6px; padding:12px 14px; border:1px solid var(--line); border-top:0; border-radius:0 0 10px 10px; background:var(--surface-2)}
.mkdet{display:grid; gap:8px}
.mktree, .mktree ul{list-style:none; margin:0; padding-left:18px}
.mktree{padding-left:2px}
.mktree li{margin:3px 0}
.mktree .tq{font-family:var(--mono); color:var(--muted)}
.small.bad{color:var(--bad)} .small.good{color:var(--good)}
/* save tools */
.advbox{border:1px dashed var(--line); border-radius:10px; padding:8px 12px}
.advbox summary{cursor:pointer; color:var(--muted); font-size:13px}
.advbox[open]{display:grid; gap:8px}
.edwarn{display:block; background:var(--accent-soft); font-size:14px; line-height:1.5}
.edbar{display:grid; gap:6px; position:sticky; top:0; z-index:5; background:var(--bg); padding:6px 0}
.edbar:empty{display:none}
.edbar .row{gap:8px; align-items:center}
.edlist{margin:4px 0 0; padding-left:18px}
.edsecs{flex-wrap:wrap; margin:8px 0}
#edbody{display:grid; gap:12px}
.edt{width:100%; border-collapse:collapse; font-size:13.5px}
.edt th, .edt td{text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top}
.edt th{font:600 11px var(--mono); letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.edt tr.sel td{background:var(--teal-soft)}
.edt td.row{gap:6px; flex-wrap:wrap}
.edt.raw td:first-child{width:34%; word-break:break-word}
.edgrid{grid-template-columns:repeat(var(--cols), 64px); gap:5px}
